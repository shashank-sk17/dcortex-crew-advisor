<figure class="rc" [class.rc--applied]="applied">
  <figcaption class="rc__cap">
    <span class="stamp">Disruption &amp; blast radius</span>
    <span class="rc__reserves">
      <span class="reserve"><b>{{ pax() }}</b><small>pax</small></span>
      <span class="reserve"><b>{{ tail() }}</b><small>{{ crew?.crew_id ?? 'crew' }} out</small></span>
      @if (orphanCount()) { <span class="reserve"><b>{{ orphanCount() }}</b><small>legs orphaned</small></span> }
      @if (maxDelay()) { <span class="reserve"><b>+{{ maxDelay() }}</b><small>min slip</small></span> }
    </span>
  </figcaption>

  <svg class="rc__svg" [attr.viewBox]="'0 0 ' + vw + ' 132'" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Route chart showing the uncovered leg and downstream shockwave">
    <defs>
      <pattern id="rc-hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="7" stroke="var(--near)" stroke-width="1.4" />
      </pattern>
    </defs>

    <!-- time axis -->
    <line class="rc__axis" [attr.x1]="0" [attr.y1]="axisY" [attr.x2]="vw" [attr.y2]="axisY" />

    <!-- legs -->
    @for (l of legs(); track l.no + l.x1) {
      <g class="rc__leg" [attr.data-kind]="l.kind">
        <line class="rc__legline" [attr.x1]="l.x1" [attr.y1]="axisY" [attr.x2]="l.x2" [attr.y2]="axisY" />
        @if (l.kind === 'orphan') {
          <rect class="rc__legfill" [attr.x]="l.x1" [attr.y]="axisY - 5" [attr.width]="l.x2 - l.x1" height="10"
                fill="url(#rc-hatch)" />
        }
        <text class="rc__legno val" [attr.x]="(l.x1 + l.x2) / 2" [attr.y]="axisY - 12" text-anchor="middle">{{ l.no }}</text>
        <text class="rc__legkind" [attr.x]="(l.x1 + l.x2) / 2" [attr.y]="axisY + 20" text-anchor="middle">{{ l.label }}</text>
        @if (l.delay) {
          <text class="rc__legdelay val" [attr.x]="l.x2" [attr.y]="axisY + 20" text-anchor="end">+{{ l.delay }}m</text>
        }
      </g>
    }

    <!-- station nodes -->
    @for (n of nodes(); track n.code + n.x) {
      <g class="rc__node">
        <rect [attr.x]="n.x - 3.5" [attr.y]="axisY - 3.5" width="7" height="7" />
        <text class="val" [attr.x]="n.x" [attr.y]="axisY + 36" text-anchor="middle">{{ n.code }}</text>
      </g>
    }
  </svg>

  <div class="rc__legend">
    <span class="key key--breach">uncovered now</span>
    <span class="key key--near">orphaned day 2</span>
    <span class="key key--ref">aircraft knock-on</span>
  </div>
</figure>
