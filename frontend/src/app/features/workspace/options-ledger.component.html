<div class="ol">
  <div class="ol__head">
    <span class="stamp">Resolution options</span>
    <span class="muted val">ranked · legal · cost</span>
  </div>

  <ol class="ol__list">
    @for (o of options; track o.action) {
      <li class="ol__row" [class.is-sel]="isSel(o)" [class.is-lead]="o.rank === 1">
        <button class="ol__hit" type="button" (click)="pick.emit(o)"
                [attr.aria-pressed]="isSel(o)">
          <span class="ol__rank val">{{ o.rank }}</span>
          <span class="ol__body">
            <span class="ol__action">{{ o.action }}</span>
            <span class="ol__meta">
              @if (o.rank === 1) { <span class="ol__lead">advisor's lead</span> }
              @if (o.coverage) { <span class="muted">{{ o.coverage }}</span> }
              @if (o.delay_hours) { <span class="reserve"><b>+{{ o.delay_hours }}</b><small>h delay</small></span> }
              @if (o.blast_radius) { <span class="reserve"><b>{{ o.blast_radius }}</b><small>blast</small></span> }
              @if (o.reachability_minutes != null) { <span class="muted val">reach {{ o.reachability_minutes }}m</span> }
            </span>
            @for (kv of breakdown(o); track kv[0]) {
              <span class="ol__bd val">{{ kv[0] }} &#8377;{{ kv[1] | number }}</span>
            }
          </span>
          <span class="ol__cost val">&#8377;{{ o.cost_inr | number }}</span>
        </button>
      </li>
    }
    @if (!options.length) {
      <li class="ol__none muted">No legal option. See near-misses below — one lever unlocks each.</li>
    }
  </ol>

  @if (nearMisses.length) {
    <div class="ol__near">
      <span class="stamp">Near-misses</span>
      @for (o of nearMisses; track o.action) {
        <button class="ol__row ol__hit is-near" type="button" (click)="pick.emit(o)"
                [class.is-sel]="isSel(o)" [attr.aria-pressed]="isSel(o)">
          <span class="ol__rank val">~</span>
          <span class="ol__body">
            <span class="ol__action">{{ o.action }}</span>
            @if (o.unlock) { <span class="ol__unlock">{{ o.unlock }}</span> }
          </span>
          <span class="ol__cost val">&#8377;{{ o.cost_inr | number }}</span>
        </button>
      }
    </div>
  }
</div>
