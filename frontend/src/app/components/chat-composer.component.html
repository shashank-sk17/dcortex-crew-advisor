<form class="composer" (submit)="send($event)">
  <textarea
    [(ngModel)]="text"
    name="q"
    rows="1"
    placeholder="Ask the advisor…  (e.g. “Captain C-1042 called in sick for P-2291 — who do I use?”)"
    (keydown.enter)="onEnter($event)"
    [disabled]="store.busy()"
  ></textarea>
  @if (store.busy()) {
    <!-- Occupies the Ask button's place rather than sitting beside it: while a
         turn is running that button is dead anyway, and stopping is the only
         thing the controller can usefully do. -->
    <button type="button" class="stop" (click)="store.stop()" title="Stop the advisor">
      Stop
    </button>
  } @else {
    <button type="submit" [disabled]="!text.trim()">Ask</button>
  }
  @if (!store.isEmpty()) {
    <button type="button" class="ghost" (click)="store.reset()" [disabled]="store.busy()">Clear</button>
  }
</form>
