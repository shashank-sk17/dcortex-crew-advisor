<div class="abstain">
  <div class="abstain__head">
    <span class="chip chip--warn">Abstained</span>
    <strong>I can't answer that reliably</strong>
  </div>
  <p class="abstain__reason">{{ data.reason }}</p>
  @if (data.needed?.length) {
    <div class="abstain__needed">
      <span class="muted">Would need:</span>
      <ul>
        @for (n of data.needed ?? []; track n) { <li>{{ n }}</li> }
      </ul>
    </div>
  }
</div>
