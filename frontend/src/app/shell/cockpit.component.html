<div class="cockpit">
  <header class="topbar">
    <a class="brand" routerLink="/board">
      <span class="brand__name">Crew Ops</span>
      <span class="brand__org">dCortex</span>
    </a>
    <nav class="nav">
      <a routerLink="/board" routerLinkActive="on"><app-icon name="flight" /> Flights</a>
      <a routerLink="/crew" routerLinkActive="on"><app-icon name="crew" /> Crew</a>
    </nav>
    <span class="spacer"></span>
    <label class="date">
      Day
      @if (state.meta()?.dates?.length) {
        <select [value]="state.date()" (change)="state.setDate($any($event.target).value)">
          @for (d of state.meta()!.dates!; track d) { <option [value]="d">{{ d }}</option> }
        </select>
      } @else {
        <!-- the live /meta doesn't send a valid-dates list yet, so a constrained
             dropdown has nothing to populate — a plain date input works either way -->
        <input type="date" [value]="state.date()" (change)="state.setDate($any($event.target).value)" />
      }
    </label>
    <span class="chip" [class.chip--warn]="mock" [class.chip--pass]="!mock">{{ mock ? 'MOCK' : 'LIVE' }}</span>
  </header>

  <div class="body" [class.left-collapsed]="!leftOpen()" [class.right-collapsed]="!rightOpen()">
    <aside class="left">
      <button class="rail-tab rail-tab--left" type="button" (click)="toggleLeft()"
              [attr.aria-expanded]="leftOpen()" aria-label="Toggle sidebar">
        <span class="rail-tab__chev" [class.flip]="leftOpen()"><app-icon name="chevron" /></span>
      </button>
      @if (leftOpen()) {
        <app-sidebar />
      } @else {
        <span class="rail-label">Sidebar</span>
      }
    </aside>
    <main class="center"><router-outlet /></main>
    <aside class="right">
      <button class="rail-tab rail-tab--right" type="button" (click)="toggleRight()"
              [attr.aria-expanded]="rightOpen()" aria-label="Toggle alerts">
        <span class="rail-tab__chev" [class.flip]="!rightOpen()"><app-icon name="chevron" /></span>
      </button>
      @if (rightOpen()) {
        <app-alerts-panel />
      } @else {
        <span class="rail-label">Alerts</span>
      }
    </aside>
  </div>

  <app-chat-bubble />
</div>
